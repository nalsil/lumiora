<!doctype html>
<!--
  NotiVault Privacy Policy — language dispatcher.
  Detects the visitor's browser language and redirects to the matching
  per-language file (privacy-<code>.html). Default: English (privacy-en.html).
  Override with ?lang=ko or #ko. No external dependencies.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NotiVault — Privacy Policy</title>
<link rel="canonical" href="privacy-en.html">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:#fff;color:#1A1A1A;display:grid;place-items:center;height:100vh}
  @media (prefers-color-scheme:dark){body{background:#141414;color:#EDEDED}}
  .box{text-align:center;padding:24px}
  a{color:#4C5FD5}
  .sp{width:26px;height:26px;margin:0 auto 14px;border:3px solid #E5E5E5;border-top-color:#4C5FD5;
      border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
<script>
(function(){
  // Supported per-language files.
  var SUPPORTED = ["en","ko","ja","zh-CN","zh-TW","es","pt-BR","fr","de","it","nl",
                   "pl","ru","uk","tr","ar","fa","he","hi","th","vi","id","ms","fil"];
  var ALIAS = { iw:"he", in:"id", tl:"fil", zh:"zh-CN", "zh-hans":"zh-CN", "zh-sg":"zh-CN",
                "zh-hant":"zh-TW", "zh-hk":"zh-TW", "zh-mo":"zh-TW", pt:"pt-BR", nb:"no" };
  function norm(s){ return (s||"").replace("_","-"); }
  function resolve(code){
    code = norm(code);
    if(!code) return null;
    var lc = code.toLowerCase();
    // exact (case-insensitive against supported)
    for(var i=0;i<SUPPORTED.length;i++){ if(SUPPORTED[i].toLowerCase()===lc) return SUPPORTED[i]; }
    if(ALIAS[lc]) return ALIAS[lc];
    var base = lc.split("-")[0];
    if(ALIAS[base]) return ALIAS[base];
    for(var j=0;j<SUPPORTED.length;j++){ if(SUPPORTED[j].toLowerCase().split("-")[0]===base) return SUPPORTED[j]; }
    return null;
  }
  function pick(){
    var q = (location.search.match(/[?&]lang=([^&]+)/)||[])[1];
    var h = (location.hash||"").replace("#","");
    var cands = [q, h].concat(navigator.languages||[], [navigator.language]);
    for(var i=0;i<cands.length;i++){ var r = resolve(cands[i]); if(r) return r; }
    return "en";
  }
  try{ location.replace("privacy-" + pick() + ".html"); }
  catch(e){ location.href = "privacy-en.html"; }
})();
</script>
</head>
<body>
  <div class="box">
    <div class="sp" aria-hidden="true"></div>
    <p>Redirecting to the privacy policy… <a href="privacy-en.html">Continue in English</a></p>
  </div>
</body>
</html>
