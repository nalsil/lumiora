<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lumiora - 루미오라</title>
    <meta name="description" content="루미오라는 명경(明鏡) 및 NotiVault 앱 서비스를 제공하며 디지털 혁신으로 미래를 밝힙니다. Lumiora provides digital solutions like MyungKyung and NotiVault." />
    <script>
        // Language detection and routing
        try {
            var userLang = navigator.language || navigator.userLanguage; 
            if (userLang && userLang.toLowerCase().startsWith('en')) {
                window.location.replace('en/index.html');
            } else {
                window.location.replace('ko/index.html');
            }
        } catch (e) {
            window.location.replace('ko/index.html');
        }
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=ko/index.html" />
    </noscript>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans+KR:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f6f8] text-slate-900 flex min-h-screen flex-col items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-xl border border-slate-100 text-center">
        <div class="text-[#1754cf] flex justify-center mb-6">
            <svg class="w-16 h-16 animate-pulse" fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight mb-4">Lumiora (루미오라)</h1>
        <p class="text-slate-500 mb-8 text-sm">
            페이지를 이동 중입니다. 자동으로 이동하지 않는 경우 아래 언어를 선택해 주세요.<br>
            Redirecting you to the appropriate version. If it does not redirect, please choose a language below.
        </p>
        <div class="flex flex-col gap-3">
            <a href="ko/index.html" id="link-ko" class="w-full py-3 px-6 bg-[#1754cf] text-white font-bold rounded-xl hover:bg-[#1242a5] transition-colors">
                한국어 (Korean)
            </a>
            <a href="en/index.html" id="link-en" class="w-full py-3 px-6 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">
                English
            </a>
        </div>
    </div>
</body>
</html>
